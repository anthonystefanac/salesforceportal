<template>
    <div class="invoice-list">
        <h1 class="invoice-list__title">Invoices</h1>
        <template if:true={hasError}>
            <p class="slds-text-color_error">Unable to load invoices right now.</p>
        </template>
        <template if:false={hasError}>
            <template if:false={hasInvoices}>
                <p class="invoice-list__empty">No invoices yet.</p>
            </template>
            <template if:true={hasInvoices}>
                <table class="invoice-list__table">
                    <thead>
                        <tr>
                            <th>Invoice Number</th>
                            <th>Invoice Date</th>
                            <th>Due Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={invoices} for:item="invoice">
                            <tr key={invoice.Id}>
                                <td>{invoice.Invoice_Number__c}</td>
                                <td>{invoice.Invoice_Date__c}</td>
                                <td>{invoice.Due_Date__c}</td>
                                <td>
                                    <lightning-formatted-number
                                        value={invoice.Amount__c}
                                        format-style="currency"
                                        currency-code="AUD"
                                    ></lightning-formatted-number>
                                </td>
                                <td>{invoice.Status__c}</td>
                                <td>
                                    <lightning-button
                                        label="View / Download"
                                        data-id={invoice.Id}
                                        onclick={handleView}
                                    ></lightning-button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
        </template>
    </div>
</template>
