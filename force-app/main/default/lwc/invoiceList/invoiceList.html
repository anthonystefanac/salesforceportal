<template>
    <div class="invoice-list">
        <h1 class="invoice-list__title">Invoices</h1>
        <template if:true={hasActiveFilter}>
            <div class="invoice-list__filter-banner">
                <span>Showing: {activeFilterLabel}</span>
                <button type="button" class="invoice-list__clear-filter" onclick={handleClearFilter}>
                    Show all invoices
                </button>
            </div>
        </template>
        <template if:true={hasError}>
            <p class="slds-text-color_error">Unable to load invoices right now.</p>
        </template>
        <template if:false={hasError}>
            <div class="invoice-list__search">
                <lightning-input
                    type="search"
                    label="Search invoices"
                    variant="label-hidden"
                    placeholder="Search by invoice number or status"
                    value={searchTerm}
                    onchange={handleSearchChange}
                ></lightning-input>
            </div>
            <template if:false={hasInvoices}>
                <div class="invoice-list__panel">
                    <p class="invoice-list__empty">{emptyStateMessage}</p>
                </div>
            </template>
            <template if:true={hasInvoices}>
                <div class="invoice-list__panel">
                <div class="invoice-list__table-wrap">
                <table class="invoice-list__table">
                    <thead>
                        <tr>
                            <template for:each={columns} for:item="column">
                                <th
                                    key={column.key}
                                    class={column.cssClass}
                                    data-field={column.key}
                                    onclick={handleSort}
                                    aria-sort={column.ariaSort}
                                >
                                    {column.label}<span class="invoice-list__sort-indicator">{column.indicator}</span>
                                </th>
                            </template>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={invoices} for:item="invoice">
                            <tr key={invoice.Id}>
                                <td>{invoice.Invoice_Number__c}</td>
                                <td>{invoice.Invoice_Date__c}</td>
                                <td>{invoice.Due_Date__c}</td>
                                <td>
                                    <lightning-formatted-number
                                        value={invoice.Amount__c}
                                        format-style="currency"
                                        currency-code="AUD"
                                    ></lightning-formatted-number>
                                </td>
                                <td>{invoice.Status__c}</td>
                                <td>
                                    <lightning-button
                                        label="View / Download"
                                        data-id={invoice.Id}
                                        onclick={handleView}
                                    ></lightning-button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                </div>
                </div>
            </template>
        </template>
    </div>
</template>
