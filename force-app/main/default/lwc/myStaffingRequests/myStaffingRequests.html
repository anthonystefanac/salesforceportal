<template>
    <div class="my-requests">
        <h1 class="my-requests__title">My Requests</h1>
        <template if:true={hasActiveFilter}>
            <div class="my-requests__filter-banner">
                <span>Showing: {activeFilterLabel}</span>
                <button type="button" class="my-requests__clear-filter" onclick={handleClearFilter}>
                    Show all requests
                </button>
            </div>
        </template>
        <template if:true={hasError}>
            <p class="slds-text-color_error">Unable to load your requests right now.</p>
        </template>
        <template if:false={hasError}>
            <template if:true={hasBanner}>
                <div class={bannerClass}>{bannerMessage}</div>
            </template>
            <div class="my-requests__search">
                <lightning-input
                    type="search"
                    label="Search requests"
                    variant="label-hidden"
                    placeholder="Search by request, facility, ward, role, specialty, or status"
                    value={searchTerm}
                    onchange={handleSearchChange}
                ></lightning-input>
            </div>
            <template if:false={hasRequests}>
                <div class="my-requests__panel">
                    <p class="my-requests__empty">{emptyStateMessage}</p>
                </div>
            </template>
            <template if:true={hasRequests}>
                <div class="my-requests__panel">
                <div class="my-requests__table-wrap">
                <table class="my-requests__table">
                    <thead>
                        <tr>
                            <th class="my-requests__th">Action</th>
                            <template for:each={columns} for:item="column">
                                <th
                                    key={column.key}
                                    class={column.cssClass}
                                    data-field={column.key}
                                    onclick={handleSort}
                                    aria-sort={column.ariaSort}
                                >
                                    {column.label}<span class="my-requests__sort-indicator">{column.indicator}</span>
                                </th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={requests} for:item="request">
                            <tr key={request.id}>
                                <td>
                                    <template if:true={request.canCancel}>
                                        <lightning-button-menu
                                            alternative-text="Actions"
                                            icon-name="utility:down"
                                            icon-size="x-small"
                                            menu-alignment="left"
                                            data-id={request.id}
                                            disabled={request.isCancelling}
                                            onselect={handleRequestCancellation}
                                        >
                                            <lightning-menu-item
                                                value="cancel"
                                                label={request.cancelMenuLabel}
                                            ></lightning-menu-item>
                                        </lightning-button-menu>
                                    </template>
                                </td>
                                <td>{request.name}</td>
                                <td>{request.facilityName}</td>
                                <td>{request.wardName}</td>
                                <td>{request.role}</td>
                                <td>{request.specialty}</td>
                                <td>{request.shiftDate}</td>
                                <td>{request.startTime}</td>
                                <td>{request.endTime}</td>
                                <td>{request.quantity}</td>
                                <td>{request.priority}</td>
                                <td>{request.assignedContact}</td>
                                <td>
                                    <c-request-status-badge status={request.status}></c-request-status-badge>
                                </td>
                                <td>{request.broadcasted}</td>
                                <td>{request.cancellationRequested}</td>
                                <td>
                                    <lightning-formatted-date-time value={request.lastUpdate}></lightning-formatted-date-time>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                </div>
                <div class="my-requests__pagination">
                    <span class="my-requests__pagination-summary">{paginationSummary}</span>
                    <template if:true={hasMultiplePages}>
                        <div class="my-requests__pagination-controls">
                            <lightning-button-icon
                                icon-name="utility:chevronleft"
                                alternative-text="Previous page"
                                disabled={isFirstPage}
                                onclick={handlePreviousPage}
                            ></lightning-button-icon>
                            <span class="my-requests__pagination-page">Page {safeCurrentPage} of {totalPages}</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                alternative-text="Next page"
                                disabled={isLastPage}
                                onclick={handleNextPage}
                            ></lightning-button-icon>
                        </div>
                    </template>
                </div>
                </div>
            </template>
        </template>
    </div>
</template>
