<template>
    <div class="dashboard">
        <h1 class="dashboard__title">Home</h1>
        <template if:false={hasError}>
            <div class="dashboard__tiles">
                <c-portal-dashboard-tile
                    label="Open Requests"
                    value={openRequestCount}
                    filter-key="open"
                    ontileclick={handleTileClick}
                ></c-portal-dashboard-tile>
                <c-portal-dashboard-tile
                    label="Unable to Fill Shifts"
                    value={unfilledShiftCount}
                    variant="warning"
                    filter-key="unfilled"
                    ontileclick={handleTileClick}
                ></c-portal-dashboard-tile>
                <c-portal-dashboard-tile
                    label="Filled Shifts"
                    value={filledShiftCount}
                    filter-key="filled"
                    ontileclick={handleTileClick}
                ></c-portal-dashboard-tile>
                <c-portal-dashboard-tile
                    label="Cancelled Shifts"
                    value={cancelledShiftCount}
                    filter-key="cancelled"
                    ontileclick={handleTileClick}
                ></c-portal-dashboard-tile>
                <c-portal-dashboard-tile
                    label="Overdue Invoices"
                    value={overdueInvoiceCount}
                    variant="warning"
                    filter-key="overdue"
                    ontileclick={handleTileClick}
                ></c-portal-dashboard-tile>
            </div>
        </template>
        <template if:true={hasError}>
            <p class="slds-text-color_error">Unable to load your dashboard right now.</p>
        </template>
    </div>
</template>
