<template>
    <div class="dashboard">
        <h1 class="dashboard__title">Home</h1>
        <template if:false={hasError}>
            <div class="dashboard__tiles">
                <c-portal-dashboard-tile
                    label="Open Requests"
                    value={openRequestCount}
                    filter-key="open"
                    ontileclick={handleTileClick}
                ></c-portal-dashboard-tile>
                <c-portal-dashboard-tile
                    label="At-Risk Shifts"
                    value={atRiskShiftCount}
                    variant="warning"
                    filter-key="at-risk"
                    ontileclick={handleTileClick}
                ></c-portal-dashboard-tile>
                <c-portal-dashboard-tile
                    label="Overdue Invoices"
                    value={overdueInvoiceCount}
                    variant="warning"
                    filter-key="overdue"
                    ontileclick={handleTileClick}
                ></c-portal-dashboard-tile>
            </div>
        </template>
        <template if:true={hasError}>
            <p class="slds-text-color_error">Unable to load your dashboard right now.</p>
        </template>
    </div>
</template>
