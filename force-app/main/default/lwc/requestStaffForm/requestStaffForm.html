<template>
    <div class="request-staff-form">
        <h1 class="request-staff-form__title">Request Staff</h1>
        <div class="request-staff-form__panel">
        <div class="request-staff-form__grid">
            <div class="request-staff-form__field request-staff-form__field_full">
                <c-facility-picker onfacilitychange={handleFacilityChange}></c-facility-picker>
            </div>
            <div class="request-staff-form__field">
                <c-ward-picker facility-id={formData.facilityId} onwardchange={handleWardChange}></c-ward-picker>
            </div>
            <div class="request-staff-form__field">
                <lightning-combobox
                    label="Role"
                    data-field="role"
                    options={roleOptions}
                    value={formData.role}
                    onchange={handleFieldChange}
                    required
                ></lightning-combobox>
            </div>
            <div class="request-staff-form__field">
                <lightning-input
                    label="Specialty"
                    data-field="specialty"
                    value={formData.specialty}
                    onchange={handleFieldChange}
                ></lightning-input>
            </div>
            <div class="request-staff-form__field">
                <lightning-input
                    type="date"
                    label="Shift Date"
                    data-field="shiftDate"
                    value={formData.shiftDate}
                    onchange={handleFieldChange}
                    required
                ></lightning-input>
            </div>
            <div class="request-staff-form__field">
                <lightning-input
                    type="time"
                    label="Start Time"
                    data-field="startTime"
                    value={formData.startTime}
                    onchange={handleFieldChange}
                    required
                ></lightning-input>
            </div>
            <div class="request-staff-form__field">
                <lightning-input
                    type="time"
                    label="End Time"
                    data-field="endTime"
                    value={formData.endTime}
                    onchange={handleFieldChange}
                    required
                ></lightning-input>
            </div>
            <div class="request-staff-form__field">
                <lightning-combobox
                    label="Quantity"
                    data-field="quantity"
                    options={quantityOptions}
                    value={formData.quantity}
                    onchange={handleFieldChange}
                    required
                ></lightning-combobox>
            </div>
            <div class="request-staff-form__field">
                <lightning-combobox
                    label="Priority"
                    data-field="priority"
                    options={priorityOptions}
                    value={formData.priority}
                    onchange={handleFieldChange}
                ></lightning-combobox>
            </div>
            <div class="request-staff-form__field request-staff-form__field_full">
                <lightning-textarea
                    label="Notes"
                    data-field="notes"
                    value={formData.notes}
                    onchange={handleFieldChange}
                ></lightning-textarea>
            </div>
        </div>
        <lightning-button
            label="Submit Request"
            variant="brand"
            onclick={handleSubmit}
            disabled={isSubmitDisabled}
        ></lightning-button>
        </div>
    </div>
</template>
