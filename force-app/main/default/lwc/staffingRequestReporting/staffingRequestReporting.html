<template>
    <div class="reporting">
        <h1 class="reporting__title">Reporting</h1>

        <template if:true={hasError}>
            <p class="slds-text-color_error">Unable to load your requests right now.</p>
        </template>

        <template if:false={hasError}>
            <div class="reporting__panel">
                <div class="reporting__controls">
                    <div class="reporting__presets">
                        <template for:each={presetButtons} for:item="preset">
                            <button
                                key={preset.key}
                                type="button"
                                class={preset.cssClass}
                                data-preset={preset.key}
                                onclick={handleSelectPreset}
                            >
                                {preset.label}
                            </button>
                        </template>
                    </div>
                    <template if:true={isCustomActive}>
                        <div class="reporting__custom-range">
                            <lightning-input
                                type="date"
                                label="From"
                                variant="label-hidden"
                                placeholder="From"
                                value={customFrom}
                                onchange={handleCustomFromChange}
                            ></lightning-input>
                            <lightning-input
                                type="date"
                                label="To"
                                variant="label-hidden"
                                placeholder="To"
                                value={customTo}
                                onchange={handleCustomToChange}
                            ></lightning-input>
                        </div>
                    </template>
                    <lightning-button
                        label="Download CSV"
                        variant="brand"
                        disabled={downloadDisabled}
                        onclick={handleDownload}
                    ></lightning-button>
                </div>

                <template if:false={hasRequests}>
                    <p class="reporting__empty">{emptyStateMessage}</p>
                </template>
                <template if:true={hasRequests}>
                    <div class="reporting__table-wrap">
                        <table class="reporting__table">
                            <thead>
                                <tr>
                                    <th>Request</th>
                                    <th>Facility</th>
                                    <th>Ward</th>
                                    <th>Role</th>
                                    <th>Specialty</th>
                                    <th>Shift Date</th>
                                    <th>Start Time</th>
                                    <th>End Time</th>
                                    <th>Quantity</th>
                                    <th>Priority</th>
                                    <th>Assigned Contact</th>
                                    <th>Status</th>
                                    <th>Broadcasted</th>
                                    <th>Cancellation Requested</th>
                                    <th>Last Update</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredRequests} for:item="request">
                                    <tr key={request.id}>
                                        <td>{request.name}</td>
                                        <td>{request.facilityName}</td>
                                        <td>{request.wardName}</td>
                                        <td>{request.role}</td>
                                        <td>{request.specialty}</td>
                                        <td>{request.shiftDate}</td>
                                        <td>{request.startTime}</td>
                                        <td>{request.endTime}</td>
                                        <td>{request.quantity}</td>
                                        <td>{request.priority}</td>
                                        <td>{request.assignedContact}</td>
                                        <td>
                                            <c-request-status-badge status={request.status}></c-request-status-badge>
                                        </td>
                                        <td>{request.broadcasted}</td>
                                        <td>{request.cancellationRequested}</td>
                                        <td>
                                            <lightning-formatted-date-time
                                                value={request.lastUpdate}
                                            ></lightning-formatted-date-time>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
