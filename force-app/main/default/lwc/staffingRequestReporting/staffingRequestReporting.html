<template>
    <div class="reporting">
        <h1 class="reporting__title">Reporting</h1>

        <template if:true={hasError}>
            <p class="slds-text-color_error">Unable to load your requests right now.</p>
        </template>

        <template if:false={hasError}>
            <div class="reporting__panel">
                <div class="reporting__controls">
                    <div class="reporting__presets">
                        <template for:each={presetButtons} for:item="preset">
                            <button
                                key={preset.key}
                                type="button"
                                class={preset.cssClass}
                                data-preset={preset.key}
                                onclick={handleSelectPreset}
                            >
                                {preset.label}
                            </button>
                        </template>
                    </div>
                    <template if:true={isCustomActive}>
                        <div class="reporting__custom-range">
                            <lightning-input
                                type="date"
                                label="From"
                                variant="label-hidden"
                                placeholder="From"
                                value={customFrom}
                                onchange={handleCustomFromChange}
                            ></lightning-input>
                            <lightning-input
                                type="date"
                                label="To"
                                variant="label-hidden"
                                placeholder="To"
                                value={customTo}
                                onchange={handleCustomToChange}
                            ></lightning-input>
                        </div>
                    </template>
                    <lightning-button
                        label="Download CSV"
                        variant="brand"
                        disabled={downloadDisabled}
                        onclick={handleDownload}
                    ></lightning-button>
                </div>

                <template if:false={hasRequests}>
                    <p class="reporting__empty">{emptyStateMessage}</p>
                </template>
                <template if:true={hasRequests}>
                    <div class="reporting__table-wrap">
                        <table class="reporting__table">
                            <thead>
                                <tr>
                                    <template for:each={columns} for:item="column">
                                        <th
                                            key={column.key}
                                            class={column.cssClass}
                                            data-field={column.key}
                                            onclick={handleSort}
                                            aria-sort={column.ariaSort}
                                        >
                                            {column.label}<span class="reporting__sort-indicator">{column.indicator}</span>
                                        </th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={displayRequests} for:item="request">
                                    <tr key={request.id} class={request.rowClass}>
                                        <td data-label="Request">{request.name}</td>
                                        <td data-label="Facility">{request.facilityName}</td>
                                        <td data-label="Ward" class="reporting__cell_secondary">{request.wardName}</td>
                                        <td data-label="Role">{request.role}</td>
                                        <td data-label="Specialty" class="reporting__cell_secondary">{request.specialty}</td>
                                        <td data-label="Shift Date">{request.shiftDateDisplay}</td>
                                        <td data-label="Start Time">{request.startTime}</td>
                                        <td data-label="End Time" class="reporting__cell_secondary">{request.endTime}</td>
                                        <td data-label="Quantity" class="reporting__cell_secondary">{request.quantity}</td>
                                        <td data-label="Priority" class="reporting__cell_secondary">{request.priority}</td>
                                        <td data-label="Assigned Contact" class="reporting__cell_secondary">{request.assignedContact}</td>
                                        <td data-label="Status">
                                            <c-request-status-badge status={request.status}></c-request-status-badge>
                                        </td>
                                        <td data-label="Broadcasted" class="reporting__cell_secondary">{request.broadcasted}</td>
                                        <td data-label="Cancellation Requested" class="reporting__cell_secondary">{request.cancellationRequested}</td>
                                        <td data-label="Last Update" class="reporting__cell_secondary">{request.lastUpdateDisplay}</td>
                                        <td class="reporting__toggle-cell">
                                            <button
                                                type="button"
                                                class="reporting__toggle"
                                                data-id={request.id}
                                                onclick={handleToggleExpand}
                                            >
                                                {request.expandToggleLabel}
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
