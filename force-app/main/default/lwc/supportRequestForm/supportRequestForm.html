<template>
    <div class="support-request-form">
        <h1 class="support-request-form__title">Support / Query</h1>

        <template if:true={submitted}>
            <div class="support-request-form__confirmation">
                <p class="support-request-form__confirmation-message">
                    Your request has been submitted. Our team will follow up shortly.
                </p>
                <div class="support-request-form__confirmation-actions">
                    <lightning-button
                        label="View My Requests"
                        variant="brand"
                        onclick={handleViewMyRequests}
                    ></lightning-button>
                    <lightning-button
                        label="Submit Another Request"
                        variant="neutral"
                        onclick={handleSubmitAnother}
                    ></lightning-button>
                </div>
            </div>
        </template>

        <template if:false={submitted}>
            <template if:true={hasError}>
                <div class="support-request-form__banner">{errorMessage}</div>
            </template>
            <div class="support-request-form__fields">
                <lightning-input
                    label="Subject"
                    data-field="subject"
                    value={formData.subject}
                    onchange={handleFieldChange}
                    required
                ></lightning-input>

                <lightning-textarea
                    label="Description"
                    data-field="description"
                    value={formData.description}
                    onchange={handleFieldChange}
                ></lightning-textarea>
            </div>
            <div class="support-request-form__submit-row">
                <lightning-button
                    class="support-request-form__submit"
                    variant="brand"
                    label={submitButtonLabel}
                    onclick={handleSubmit}
                    disabled={isSubmitDisabled}
                ></lightning-button>
                <template if:true={isSubmitting}>
                    <lightning-spinner
                        size="small"
                        alternative-text="Submitting request"
                        class="support-request-form__spinner"
                    ></lightning-spinner>
                </template>
            </div>
        </template>
    </div>
</template>
