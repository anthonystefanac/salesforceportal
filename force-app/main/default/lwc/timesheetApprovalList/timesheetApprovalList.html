<template>
    <div class="timesheet-approval-list">
        <h1 class="timesheet-approval-list__title">Timesheet Approval</h1>
        <template if:true={hasError}>
            <p class="slds-text-color_error">Unable to load timesheets right now.</p>
        </template>
        <template if:false={hasError}>
            <template if:false={hasTimesheets}>
                <p class="timesheet-approval-list__empty">No timesheets awaiting approval.</p>
            </template>
            <template if:true={hasTimesheets}>
                <ul class="timesheet-approval-list__list">
                    <template for:each={timesheets} for:item="timesheet">
                        <li key={timesheet.id}>
                            <button
                                type="button"
                                class="timesheet-approval-list__item"
                                data-id={timesheet.id}
                                onclick={handleSelect}
                            >
                                <span class="timesheet-approval-list__request">{timesheet.requestName} - {timesheet.facilityName}</span>
                                <span class="timesheet-approval-list__meta">{timesheet.workerName} | {timesheet.shiftDate} | {timesheet.hoursWorked} hrs</span>
                            </button>
                        </li>
                    </template>
                </ul>
            </template>
        </template>
        <template if:true={hasSelection}>
            <c-timesheet-approval-detail
                timesheet-id={selectedTimesheetId}
                staffing-request-id={selectedStaffingRequestId}
                ontimesheetupdated={handleTimesheetUpdated}
            ></c-timesheet-approval-detail>
        </template>
    </div>
</template>
